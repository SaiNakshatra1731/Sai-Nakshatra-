
<script>
const summary = document.getElementById("birthSummary");
const statusBox = document.getElementById("status");

const cards = document.querySelectorAll(".grid .card");

async function loadAstrologyResults() {
  try {
    const saved = sessionStorage.getItem(
      "saiNakshatraBirthDetails"
    );

    if (!saved) {
      statusBox.textContent =
        "Birth details not found. Please enter them again.";
      return;
    }

    const details = JSON.parse(saved);

    if (
      !details.birthDate ||
      !details.birthTime ||
      !details.birthPlace
    ) {
      statusBox.textContent =
        "Birth details are incomplete. Please enter them again.";
      return;
    }

    summary.replaceChildren();

    [
      ["Date of birth", details.birthDate],
      ["Time of birth", details.birthTime],
      ["Birthplace", details.birthPlace]
    ].forEach(([label, value]) => {
      const line = document.createElement("p");
      const strong = document.createElement("strong");

      strong.textContent = label + ": ";
      line.append(strong, document.createTextNode(value));
      summary.appendChild(line);
    });

    statusBox.textContent =
      "Calculating your astrological profile...";

    const response = await fetch("/api/calculate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        birthDate: details.birthDate,
        birthTime: details.birthTime,
        birthPlace: details.birthPlace
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.error || "The calculation could not be completed."
      );
    }

    const values = [
      result.rashi,
      result.nakshatra,
      result.pada
    ];

    const descriptions = [
      "Your Moon sign",
      "Your birth star",
      "Your Nakshatra quarter"
    ];

    values.forEach((value, index) => {
      const valueElement =
        cards[index].querySelector(".value");

      valueElement.textContent =
        value !== undefined && value !== null && value !== ""
          ? value
          : "Not available";

      const description =
        cards[index].querySelector("p:last-child");

      description.textContent = descriptions[index];
    });

    statusBox.textContent =
      "Your astrological calculation is complete.";

  } catch (error) {
    statusBox.textContent =
      "Calculation unavailable: " + error.message;

    console.error("Sai Nakshatra:", error);
  }
}

loadAstrologyResults();
</script>
