
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b1d">
  <title>Birth Details | Sai Nakshatra">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 18px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at top, #202e67, transparent 55%),
        linear-gradient(160deg, #070b1d, #101735, #050816);
    }

    header {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .logo span {
      color: #a5b4fc;
    }

    header a:last-child {
      color: #c4b5fd;
      text-decoration: none;
      font-size: 13px;
    }

    main {
      max-width: 520px;
      margin: 50px auto;
      padding: 30px 24px;
      border: 1px solid #ffffff20;
      border-radius: 24px;
      background: #ffffff09;
      box-shadow: 0 20px 70px #00000025;
    }

    .eyebrow {
      color: #c4b5fd;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 38px);
      margin-bottom: 12px;
    }

    .intro {
      color: #b7c2d9;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #e2e8f0;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ffffff25;
      border-radius: 12px;
      outline: none;
      color: #fff;
      background: #080d25;
      font: inherit;
      font-size: 14px;
      color-scheme: dark;
    }

    input:focus {
      border-color: #a5b4fc;
      box-shadow: 0 0 0 3px #a5b4fc18;
    }

    .hint {
      color: #8490ad;
      font-size: 11px;
      line-height: 1.6;
      margin-top: 8px;
    }

    .primary {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: 0;
      border-radius: 30px;
      color: #080d25;
      background: linear-gradient(110deg, #c4b5fd, #93c5fd);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .footer {
      color: #8490ad;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
      margin-top: 25px;
    }

    @media (max-width: 400px) {
      main {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="Index.html">🌟 Sai <span>Nakshatra</span></a>
    <a href="Plan.html">← Plans</a>
  </header>

  <main>
    <p class="eyebrow">Your personal journey</p>
    <h1>Enter Birth Details ✨</h1>
    <p class="intro">
      Enter the details below to prepare your personalised
      astrology experience. Please check them carefully.
    </p>

    <form id="birthForm">
      <div class="field">
        <label for="birthDate">Date of birth</label>
        <input
          id="birthDate"
          name="birthDate"
          type="date"
          required
        >
      </div>

      <div class="field">
        <label for="birthTime">Time of birth</label>
        <input
          id="birthTime"
          name="birthTime"
          type="time"
          required
        >
        <p class="hint">
          If you're unsure, check with a family member or your birth record.
        </p>
      </div>

      <div class="field">
        <label for="birthPlace">Birthplace (city or town)</label>
        <input
          id="birthPlace"
          name="birthPlace"
          type="text"
          placeholder="e.g. Ranchi, Jharkhand"
          maxlength="100"
          autocomplete="off"
          required
        >
      </div>

      <p class="error" id="error" role="alert"></p>

      <button class="primary" type="submit">
        Continue to Results →
      </button>
    </form>

    <p class="footer">
      Your details are used to prepare this prototype experience.
      Avoid entering information you don't want to share.
      No astrology calculation is performed on this page yet.
    </p>
  </main>

  <script>
    const form = document.getElementById("birthForm");
    const dateInput = document.getElementById("birthDate");
    const timeInput = document.getElementById("birthTime");
    const placeInput = document.getElementById("birthPlace");
    const error = document.getElementById("error");

    dateInput.max = new Date().toISOString().slice(0, 10);

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      error.textContent = "";

      const date = dateInput.value;
      const time = timeInput.value;
      const place = placeInput.value.trim();

      if (!date || !time || !place) {
        error.textContent = "Please complete all three fields.";
        return;
      }

      if (date > dateInput.max) {
        error.textContent = "Date of birth cannot be in the future.";
        return;
      }

      const details = {
        birthDate: date,
        birthTime: time,
        birthPlace: place
      };

      sessionStorage.setItem(
        "saiNakshatraBirthDetails",
        JSON.stringify(details)
      );

      window.location.href = "Result.html";
    });
  </script>
</body>
</html>
